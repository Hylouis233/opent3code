name: Integration source snapshot
on:
  push:
    branches: [ops/integration-source-20260915]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository_id == '1341460159'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch immutable base and verify exact candidate patch
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --no-recurse-submodules --depth=1 origin 712baceb199943385e3e059e825c32188ecad9ba
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/integration-output
          curl --fail --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/integration-feature.patch.gz.b64" -o /tmp/integration-output/input.b64
          python3 <<'PY'
          import pathlib,base64,gzip,hashlib,subprocess,json
          text=pathlib.Path('/tmp/integration-output/input.b64').read_text().strip()
          fixes=[[243,247,''],[3670,3673,''],[4056,4057,''],[4069,4069,'nt'],[5146,5148,''],[5654,5654,'h'],[5955,5955,'4'],[6102,6104,''],[15218,15222,'']]
          for start,end,value in fixes[::-1]: text=text[:start]+value+text[end:]
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='554563d2f20c9fd339545a5945aad3c6bee22c8f7308ea8a08f7879379313545'
          pathlib.Path('/tmp/integration-output/candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','/tmp/integration-output/candidate.patch'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==9 and all(p.startswith(('apps/','packages/')) and p.endswith('.ts') for p in paths)
          pathlib.Path('/tmp/integration-output/paths.json').write_text(json.dumps(paths))
          PY
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format candidate and preserve reviewable source
        run: |
          python3 <<'PY'
          import pathlib,json,subprocess,base64
          out=pathlib.Path('/tmp/integration-output')
          paths=json.loads((out/'paths.json').read_text())
          subprocess.run(['vp','fmt',*paths],check=True)
          (out/'files.json').write_text(json.dumps([{'path':p,'content':pathlib.Path(p).read_text()} for p in paths]))
          subprocess.run(['git','add','--',*paths],check=True)
          (out/'formatted.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          PY
      - name: Typecheck affected workspaces
        continue-on-error: true
        run: |
          set -o pipefail
          vp run --filter t3 --filter @t3tools/web --filter @t3tools/contracts typecheck 2>&1 | tee /tmp/integration-output/typecheck.log
      - name: Run focused native ACP tests
        continue-on-error: true
        run: |
          set -o pipefail
          vp run --filter t3 test src/provider/Drivers/ExternalAcpDriver.test.ts src/provider/acp/ExternalAcpPolicy.test.ts 2>&1 | tee /tmp/integration-output/tests.log
      - name: Lint changed files
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -c "import json,subprocess;raise SystemExit(subprocess.call(['vp','lint',*json.load(open('/tmp/integration-output/paths.json'))]))" 2>&1 | tee /tmp/integration-output/lint.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-candidate-diagnostics
          path: /tmp/integration-output/
          retention-days: 3
