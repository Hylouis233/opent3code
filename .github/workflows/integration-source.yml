name: Integration source snapshot
on:
  push:
    branches: [ops/integration-source-20260915]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository_id == '1341460159' && github.actor == 'Hylouis233'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # JSON source is treated only as bytes. This job never executes artifact code.
      - uses: actions/download-artifact@v8
        with:
          name: integration-verified-source
          run-id: 34992090870
          github-token: ${{ github.token }}
          path: source-data
      - uses: actions/github-script@v8
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const parent='0a7afdc46f6a81d8bae8c8b434fc4e495be5216c';
            const main='712baceb199943385e3e059e825c32188ecad9ba';
            const bytes=fs.readFileSync('source-data/files.json');
            if(crypto.createHash('sha256').update(bytes).digest('hex')!=='b3b02fb30e51dfdd9d3570cfc80286f39fd3b6a4c88dfa2545f9242d322e66da') throw Error('Source digest mismatch');
            const allowed=new Set([
              '.github/ISSUE_TEMPLATE/config.yml','.github/SECURITY.md','.github/opent3code-release.json',
              '.github/scripts/opent3code-preview.test.cjs','.github/scripts/opent3code-release.cjs','.github/scripts/opent3code-release.test.cjs',
              '.github/workflows/ci.yml','.github/workflows/mobile-eas-preview.yml','.github/workflows/mobile-eas-production.yml',
              '.github/workflows/opent3code-release.yml','.github/workflows/publish-aur.yml','.github/workflows/release-desktop.yml','.github/workflows/release.yml','.github/workflows/web-preview.yml',
              '.gitignore','README.md',
              'apps/server/src/provider/Drivers/ExternalAcpDriver.test.ts','apps/server/src/provider/Drivers/ExternalAcpDriver.ts',
              'apps/server/src/provider/acp/AcpSessionRuntime.ts','apps/server/src/provider/acp/ExternalAcpPolicy.test.ts','apps/server/src/provider/acp/ExternalAcpPolicy.ts','apps/server/src/provider/builtInDrivers.ts',
              'apps/web/src/components/settings/providerDriverMeta.ts',
              'docs/operations/development.md','docs/releases/0.1.0-alpha.1.md','docs/user/opent3code-preview.md',
              'integrations/dsh-opent3code/LICENSE','integrations/dsh-opent3code/README.md','integrations/dsh-opent3code/cordis.patch.yml','integrations/dsh-opent3code/package.json','integrations/dsh-opent3code/prepare-profile.mjs',
              'knip.jsonc','packages/contracts/src/model.ts','packages/contracts/src/settings.ts','scripts/opent3code-preview.mjs'
            ]);
            const files=JSON.parse(bytes);
            if(files.length!==allowed.size||new Set(files.map(f=>f.path)).size!==files.length)throw Error('Invalid path set');
            for(const file of files){
              if(!allowed.has(file.path)||typeof file.content!=='string'||file.content.length>150000)throw Error('Invalid source');
              if(file.mode!==(file.path==='scripts/opent3code-preview.mjs'?'100755':'100644'))throw Error('Invalid mode');
            }
            const {data:metadata}=await github.rest.repos.get(context.repo);
            if(metadata.id!==1341460159||metadata.owner.login!=='Hylouis233')throw Error('Wrong repository');
            const {data:head}=await github.rest.git.getRef({...context.repo,ref:'heads/feat/mcode-dsh-acp'});
            const {data:base}=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(head.object.sha!==parent||base.object.sha!==main)throw Error('A branch moved; reconcile instead of overwriting');
            const {data:commit}=await github.rest.git.getCommit({...context.repo,commit_sha:parent});
            const tree=[];
            for(const file of files){
              const {data:blob}=await github.rest.git.createBlob({...context.repo,content:file.content,encoding:'utf-8'});
              tree.push({path:file.path,mode:file.mode,type:'blob',sha:blob.sha});
            }
            const {data:nextTree}=await github.rest.git.createTree({...context.repo,base_tree:commit.tree.sha,tree});
            const {data:next}=await github.rest.git.createCommit({...context.repo,tree:nextTree.sha,parents:[parent],message:'fix(integrations): finalize supervised ACP providers and isolated source release\n\nDistinguish MCode permissionMode from default/plan work mode and fail closed on missing or unsettled approval policy. Match actual native CLI metadata with regression fixtures. Normalize source, include launcher/release tests in CI, isolate inherited publishers, and correct source-preview instructions.\n\nRead-only verification run 34992090870: 24 ACP tests, 50 maintenance tests, lint, typecheck and unused-code checks passed. Actual MCode process confirmed a transition from bypassPermissions to Ask using a loopback-only fixture. DSH companion installation, effective config and native session creation were verified separately. Paid-account generation and native desktop installers are not certified. Full PR and exact-main CI are still required before publication.'});
            console.log('PROPOSED_COMMIT='+next.sha);
            console.log('PROPOSED_TREE='+nextTree.sha);
            await core.summary.addRaw(`Created unreferenced candidate ${next.sha}. No branch, PR state, tag or release was changed.\n`).write();
