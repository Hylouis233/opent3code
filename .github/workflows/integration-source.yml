name: Integration source snapshot
on:
  push:
    branches: [ops/integration-source-20260915]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository_id == '1341460159' && github.actor == 'Hylouis233'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # Artifact content is JSON data to commit, never code to execute in this privileged job.
      - uses: actions/download-artifact@v8
        with:
          name: integration-candidate-diagnostics
          run-id: 34986211968
          github-token: ${{ github.token }}
          path: source-data
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const base = '712baceb199943385e3e059e825c32188ecad9ba';
            const branch = 'feat/mcode-dsh-acp';
            const data = fs.readFileSync('source-data/files.json');
            if (crypto.createHash('sha256').update(data).digest('hex') !== '68438a686e126d62d5932edb1015699dbd4f79edd99eadeb0492e018c4f0aba2') throw Error('Source transfer digest mismatch');
            const allowed = new Set([
              'apps/server/src/provider/Drivers/ExternalAcpDriver.test.ts',
              'apps/server/src/provider/Drivers/ExternalAcpDriver.ts',
              'apps/server/src/provider/acp/AcpSessionRuntime.ts',
              'apps/server/src/provider/acp/ExternalAcpPolicy.test.ts',
              'apps/server/src/provider/acp/ExternalAcpPolicy.ts',
              'apps/server/src/provider/builtInDrivers.ts',
              'apps/web/src/components/settings/providerDriverMeta.ts',
              'packages/contracts/src/model.ts',
              'packages/contracts/src/settings.ts'
            ]);
            const files = JSON.parse(data);
            if (files.length !== allowed.size || new Set(files.map(f=>f.path)).size !== files.length) throw Error('Unexpected paths');
            const replace = (file, before, after) => {
              if (file.content.split(before).length !== 2) throw Error('Replacement is not unique: '+before);
              file.content = file.content.replace(before, after);
            };
            for (const file of files) {
              if (!allowed.has(file.path) || typeof file.content !== 'string' || file.content.length > 150000) throw Error('Invalid source file');
              if (file.path.endsWith('/ExternalAcpDriver.ts')) {
                replace(file, 'type Runtime = ', 'const decodeResume = Schema.decodeUnknownEffect(ExternalAcpResume);\n\ntype Runtime = ');
                replace(file, 'const processEnv =', 'const processEnv: NodeJS.ProcessEnv =');
                replace(file, 'Schema.decodeUnknownEffect(ExternalAcpResume)(input.resumeCursor)', 'decodeResume(input.resumeCursor)');
                replace(file, 'detail: permissionRequest.detail,', 'detail: permissionRequest.detail ?? "Native CLI permission request",');
                replace(file, 'streamChanges: state.changes,', 'streamChanges: SubscriptionRef.changes(state),');
              }
              if (file.path.endsWith('/ExternalAcpDriver.test.ts')) {
                replace(file, 'import * as Fiber from "effect/Fiber";\n', '');
                replace(file, 'const fixture = String.raw', 'const decodeEvent = Schema.decodeUnknownEffect(ProviderRuntimeEvent);\n\nconst fixture = String.raw');
                replace(file, 'environment: {},', 'environment: [],');
                replace(file, 'Schema.decodeUnknownSync(ProviderRuntimeEvent)(event);', 'yield* decodeEvent(event).pipe(Effect.orDie);');
              }
            }
            const repo = context.repo;
            const {data:metadata}=await github.rest.repos.get(repo);
            if(metadata.id!==1341460159 || metadata.owner.login!=='Hylouis233') throw Error('Wrong repository');
            const {data:main}=await github.rest.git.getRef({...repo,ref:'heads/main'});
            if(main.object.sha!==base) throw Error('Main changed; reconcile before creating branch');
            try { await github.rest.git.getRef({...repo,ref:'heads/'+branch}); throw Error('Branch already exists'); }
            catch(e) { if(e.status!==404) throw e; }
            const {data:commit}=await github.rest.git.getCommit({...repo,commit_sha:base});
            const tree=[];
            for(const file of files) {
              const {data:blob}=await github.rest.git.createBlob({...repo,content:file.content,encoding:'utf-8'});
              tree.push({path:file.path,mode:'100644',type:'blob',sha:blob.sha});
            }
            const {data:nextTree}=await github.rest.git.createTree({...repo,base_tree:commit.tree.sha,tree});
            const {data:next}=await github.rest.git.createCommit({...repo,tree:nextTree.sha,parents:[base],message:'feat(providers): add supervised MCode and DSH ACP preview adapters\n\nAdd explicit native driver identities, scoped sessions, one-shot permission mapping, cancellation and resume validation. Include subprocess fixtures. Targeted preflight exposed API/type errors; this commit applies their focused fixes. Full PR CI is required before merge. No release or runtime authentication claim.'});
            await github.rest.git.createRef({...repo,ref:'refs/heads/'+branch,sha:next.sha});
            await core.summary.addRaw(`Created review branch ${branch} at ${next.sha}; main unchanged.\n`).write();
