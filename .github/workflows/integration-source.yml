name: Integration source snapshot
on:
  push:
    branches: [ops/integration-source-20260915]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository_id == '1341460159'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact source transfer
        run: |
          mkdir -p snapshot
          curl --fail --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/integration-feature.patch.gz.b64" -o snapshot/input.b64
      - uses: actions/upload-artifact@v7
        with:
          name: integration-transfer-verification
          path: snapshot/
          retention-days: 3
