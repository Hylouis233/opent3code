name: Integration source snapshot
on:
  push:
    branches: [ops/integration-source-20260915]
    paths: [.github/workflows/integration-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository_id == '1341460159'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact integration candidate and deterministic finalization
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --no-recurse-submodules --depth=5 origin 0a7afdc46f6a81d8bae8c8b434fc4e495be5216c
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/integration-output
          curl --fail --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/integration-finalize.py" -o /tmp/integration-finalize.py
          python3 /tmp/integration-finalize.py
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format and preserve exact reviewable source
        run: |
          python3 <<'PY'
          import pathlib,json,subprocess
          paths=sorted(set(subprocess.check_output(['git','diff','712baceb199943385e3e059e825c32188ecad9ba','HEAD','--name-only'],text=True).splitlines()+subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          subprocess.run(['vp','fmt',*[p for p in paths if not p.endswith('LICENSE') and p!='.gitignore']],check=True)
          entries=[]
          for p in paths:
              mode=subprocess.check_output(['git','ls-files','--stage','--',p],text=True).split()[0]
              entries.append({'path':p,'mode':mode,'content':pathlib.Path(p).read_text()})
          pathlib.Path('/tmp/integration-output/files.json').write_text(json.dumps(entries))
          pathlib.Path('/tmp/integration-output/paths.json').write_text(json.dumps(paths))
          PY
      - name: Test maintenance, provider behavior, types and lint
        continue-on-error: true
        run: |
          python3 <<'PY'
          import pathlib,json,subprocess
          out=pathlib.Path('/tmp/integration-output')
          paths=json.loads((out/'paths.json').read_text())
          tests=sorted(str(p) for p in pathlib.Path('.github/scripts').glob('opent3code-*.test.cjs'))
          commands={
            'maintenance':['node','--test',*tests],
            'provider':['vp','run','--filter','t3','test','src/provider/Drivers/ExternalAcpDriver.test.ts','src/provider/acp/ExternalAcpPolicy.test.ts'],
            'types':['vp','run','--filter','t3','--filter','@t3tools/web','--filter','@t3tools/contracts','typecheck'],
            'lint':['vp','lint',*[p for p in paths if p.endswith(('.ts','.mjs','.cjs'))]],
            'knip':['vp','run','knip:check'],
          }
          status={}
          for name,command in commands.items():
              with (out/(name+'.log')).open('w') as log:
                  try: status[name]=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=300).returncode
                  except subprocess.TimeoutExpired: status[name]=124
              print(name,status[name],flush=True)
          (out/'status.json').write_text(json.dumps(status))
          raise SystemExit(0 if all(code==0 for code in status.values()) else 1)
          PY
      - name: Verify installation and real session negotiation without model requests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export MINIMAX_DATA_DIR="$RUNNER_TEMP/mcode-home"
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          export DSH_TELEMETRY_DISABLED=1
          npm install --prefix "$RUNNER_TEMP/cli-runtime" @minimax-ai/code@0.4.7 @deepseek-ai/dsh@0.1.5-rc.1 pnpm@11.10.0 > /tmp/integration-output/install.log 2>&1
          export PATH="$RUNNER_TEMP/cli-runtime/node_modules/.bin:$PATH"
          npm pack ./integrations/dsh-opent3code --ignore-scripts --pack-destination /tmp/integration-output > /tmp/integration-output/pack.log
          node integrations/dsh-opent3code/prepare-profile.mjs "$DSH_HOME"
          dsh plugin --profile opent3code add /tmp/integration-output/opent3code-dsh-plugin-0.1.0-alpha.1.tgz > /tmp/integration-output/dsh-install.log 2>&1
          dsh --profile opent3code --dump-config > /tmp/integration-output/dsh-effective.yml
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          import {createInterface} from 'node:readline';
          import {writeFileSync} from 'node:fs';
          for(const [kind,args] of [['mcode',['acp']],['dsh',['--profile','opent3code']]]) {
            const child=spawn(kind,args,{stdio:['pipe','pipe','pipe'],env:process.env});
            const closed=new Promise(resolve=>child.once('close',resolve));
            let stderr=''; child.stderr.on('data',v=>{stderr+=v;});child.stdin.on('error',()=>{});
            const pending=new Map(); let seq=0;
            child.on('exit',()=>{for(const waiter of pending.values()){clearTimeout(waiter.timer);waiter.reject(Error('Native process exited'));}pending.clear();});
            createInterface({input:child.stdout}).on('line',line=>{
              try {const msg=JSON.parse(line); const waiter=pending.get(msg.id); if(waiter){pending.delete(msg.id);clearTimeout(waiter.timer);waiter.resolve(msg);}}
              catch {}
            });
            const call=(method,params)=>new Promise((resolve,reject)=>{
              const id=++seq;const timer=setTimeout(()=>{pending.delete(id);reject(Error(method+' timed out'));},45000);
              pending.set(id,{resolve,reject,timer});child.stdin.write(JSON.stringify({jsonrpc:'2.0',id,method,params})+'\n');
            });
            const evidence={kind,modelRequestSent:false};
            try {
              evidence.initialize=await call('initialize',{protocolVersion:1,clientCapabilities:{},clientInfo:{name:'opent3code',version:'0.1.0-alpha.1'}});
              evidence.session=await call('session/new',{cwd:process.cwd(),mcpServers:[]});
              if(evidence.session.result?.sessionId && kind==='mcode') {
                const options=evidence.session.result.configOptions??[];
                const mode=options.find(o=>o.category==='mode');
                if(mode) evidence.mode=await call('session/set_config_option',{sessionId:evidence.session.result.sessionId,configId:mode.id,value:'default'});
                else if(evidence.session.result.modes) evidence.mode=await call('session/set_mode',{sessionId:evidence.session.result.sessionId,modeId:'default'});
              }
            } catch(error){evidence.error=error.message;}
            finally {
              child.kill('SIGTERM');const timer=setTimeout(()=>child.kill('SIGKILL'),3000);
              await closed;clearTimeout(timer);
              for(const waiter of pending.values())clearTimeout(waiter.timer);
              evidence.stderr=stderr;
              writeFileSync('/tmp/integration-output/'+kind+'-session.json',JSON.stringify(evidence,null,2));
            }
          }
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-final-verification
          path: /tmp/integration-output/
          retention-days: 3
