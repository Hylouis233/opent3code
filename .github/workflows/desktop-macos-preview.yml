name: Desktop macOS Preview

# Keep upstream's workflow name and preview:mac label for compatibility.
# OpenT3Code produces an unsigned JS bundle, not a signed/notarized .app or DMG.
# Requests are one-shot: later commits need a newly applied preview label.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: desktop-macos-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ contains(fromJSON('["preview:mac", "preview:bundle"]'), github.event.label.name) }}

jobs:
  build:
    name: Build preview JS bundle
    if: contains(fromJSON('["preview:mac", "preview:bundle"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Public, credential-free checkout also avoids cleanup of vendored gitlinks.
      - name: Checkout exact PR head
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_REF"
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Set preview version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/update-release-package-versions.ts "${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
      - uses: ./.github/actions/setup-apt-mirrors
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build JS bundle
        run: vp run build:desktop
      - name: Verify preload bundle
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opent3code-preview-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 7
