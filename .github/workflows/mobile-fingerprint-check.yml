name: Mobile Fingerprint Check

# Preserve upstream's advisory native-fingerprint comparison. PR code has a
# read-only token; label writes occur in a separate, API-only job.
on:
  pull_request:
    # Re-evaluate rebases and base changes even when native paths disappear.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: mobile-fingerprint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Native fingerprint diff
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed_platforms: ${{ steps.compare.outputs.changed_platforms }}
      relevant: ${{ steps.changes.outputs.relevant }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      merge_sha: ${{ steps.changes.outputs.merge_sha }}
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --no-recurse-submodules --depth=2 --filter=blob:none origin "$CHECKOUT_REF"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
      - id: changes
        name: Detect native fingerprint inputs
        shell: bash
        env:
          EXPECTED_MERGE: ${{ github.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_sha=$(git rev-parse --verify HEAD)
          test "$merge_sha" = "$EXPECTED_MERGE"
          read -ra parents <<< "$(git show -s --format=%P HEAD)"
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$EXPECTED_HEAD"
          base_sha="${parents[0]}"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          status=0
          git diff --quiet --no-renames --no-ext-diff --no-textconv "$base_sha" HEAD -- \
            apps/mobile/ packages/client-runtime/ packages/contracts/ packages/shared/ \
            assets/ scripts/ patches/ package.json pnpm-lock.yaml pnpm-workspace.yaml \
            .github/workflows/mobile-fingerprint-check.yml || status=$?
          case "$status" in
            0)
              echo "relevant=false" >> "$GITHUB_OUTPUT"
              echo "No native fingerprint inputs changed; any current native change label can be cleared." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1) echo "relevant=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Could not inspect native fingerprint inputs." >&2; exit "$status" ;;
          esac
      - name: Setup Vite+
        if: steps.changes.outputs.relevant == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Expose pnpm
        if: steps.changes.outputs.relevant == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version
      - name: Fingerprint merge result
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/head/$platform.json"
          done
      - name: Fingerprint base
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          git -c submodule.recurse=false checkout --quiet --detach "$BASE_SHA"
          pnpm install --filter=@t3tools/mobile...
          cd apps/mobile
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/base/$platform.json"
          done
      - id: compare
        name: Compare fingerprints
        if: steps.changes.outputs.relevant == 'true'
        run: |
          changed=""
          {
            echo "## Native fingerprint diff"
            echo
            for platform in ios android; do
              head_hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fp/head/$platform.json")"
              base_hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fp/base/$platform.json")"
              if [ "$head_hash" = "$base_hash" ]; then
                echo "- **$platform**: unchanged (\`$head_hash\`)"
              else
                changed="$changed $platform"
                echo "- **$platform**: \`$base_hash\` -> \`$head_hash\`; a new native build is needed before compatible OTA updates."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed_platforms=${changed# }" >> "$GITHUB_OUTPUT"
      - name: Upload fingerprint evidence
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-fingerprints
          path: ${{ runner.temp }}/fp
          retention-days: 7
          if-no-files-found: error

  label:
    name: Label native changes
    needs: fingerprint
    # As upstream: external fork PRs get evidence and summary, not label writes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # No checkout, dependencies, or PR-authored scripts in this privileged job.
      - name: Sync native change label
        uses: actions/github-script@v8
        env:
          CHANGED_PLATFORMS: ${{ needs.fingerprint.outputs.changed_platforms }}
          FINGERPRINT_RELEVANT: ${{ needs.fingerprint.outputs.relevant }}
          CHECKED_BASE: ${{ needs.fingerprint.outputs.base_sha }}
          CHECKED_MERGE: ${{ needs.fingerprint.outputs.merge_sha }}
        with:
          script: |
            const repo = context.repo;
            const eventPull = context.payload.pull_request;
            const number = eventPull.number;
            const value = process.env.CHANGED_PLATFORMS ?? "";
            const relevant = process.env.FINGERPRINT_RELEVANT;
            const base = process.env.CHECKED_BASE;
            const merge = process.env.CHECKED_MERGE;
            if (!["", "ios", "android", "ios android"].includes(value) ||
                !["true", "false"].includes(relevant) || (relevant === "false" && value !== "") ||
                !/^[a-f0-9]{40}$/.test(base ?? "") || !/^[a-f0-9]{40}$/.test(merge ?? "") ||
                merge !== context.sha) {
              throw new Error("Invalid fingerprint output or candidate identity.");
            }
            const currentPull = async () => {
              for (let attempt = 0; attempt < 8; attempt++) {
                const { data: pull } = await github.rest.pulls.get({ ...repo, pull_number: number });
                const fullName = `${repo.owner}/${repo.repo}`;
                if (pull.state !== "open" || pull.head.sha !== eventPull.head.sha ||
                    pull.head.repo?.full_name !== fullName || pull.base.repo?.full_name !== fullName ||
                    pull.base.ref !== eventPull.base.ref) return null;
                // GitHub computes mergeability asynchronously after PR events.
                // Retry only an unknown state; never treat it as successful evidence.
                if (pull.mergeable === null) {
                  if (attempt === 7) return null;
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                  continue;
                }
                if (pull.mergeable !== true || pull.merge_commit_sha !== merge) return null;
                const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: pull.base.ref });
                return branch.commit.sha === base ? pull : null;
              }
              return null;
            };
            if (!(await currentPull())) {
              core.notice("Fingerprint candidate or base moved; labels left unchanged.");
              return;
            }
            const name = "📱 Native Change";
            try {
              await github.rest.issues.getLabel({ ...repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({ ...repo, name, color: "d93f0b", description: "Native fingerprint changed; a new native build is required for compatible OTA updates." });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await github.rest.issues.getLabel({ ...repo, name });
              }
            }
            // Recheck both refs immediately before changing PR labels.
            const pull = await currentPull();
            if (!pull) {
              core.notice("Fingerprint candidate or base moved during publication; labels left unchanged.");
              return;
            }
            const hasLabel = pull.labels.some((label) => label.name === name);
            if (value && !hasLabel) {
              await github.rest.issues.addLabels({ ...repo, issue_number: number, labels: [name] });
            } else if (!value && hasLabel) {
              try {
                await github.rest.issues.removeLabel({ ...repo, issue_number: number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
