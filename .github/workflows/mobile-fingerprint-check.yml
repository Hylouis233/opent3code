name: Mobile Fingerprint Check

# Preserve upstream's advisory native-fingerprint comparison. PR code has a
# read-only token; label writes occur in a separate, API-only job.
on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-fingerprint-check.yml

permissions:
  contents: read

concurrency:
  group: mobile-fingerprint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Native fingerprint diff
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed_platforms: ${{ steps.compare.outputs.changed_platforms }}
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version
      - name: Fingerprint merge result
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/head/$platform.json"
          done
      - name: Fingerprint base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --quiet "$BASE_SHA"
          pnpm install --filter=@t3tools/mobile...
          cd apps/mobile
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/base/$platform.json"
          done
      - id: compare
        name: Compare fingerprints
        run: |
          changed=""
          {
            echo "## Native fingerprint diff"
            echo
            for platform in ios android; do
              head_hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fp/head/$platform.json")"
              base_hash="$(jq -er '.hash | select(type == "string" and length > 0)' "$RUNNER_TEMP/fp/base/$platform.json")"
              if [ "$head_hash" = "$base_hash" ]; then
                echo "- **$platform**: unchanged (\`$head_hash\`)"
              else
                changed="$changed $platform"
                echo "- **$platform**: \`$base_hash\` -> \`$head_hash\`; a new native build is needed before compatible OTA updates."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed_platforms=${changed# }" >> "$GITHUB_OUTPUT"
      - name: Upload fingerprint evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-fingerprints
          path: ${{ runner.temp }}/fp
          retention-days: 7
          if-no-files-found: error

  label:
    name: Label native changes
    needs: fingerprint
    # As upstream: external fork PRs get evidence and summary, not label writes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # No checkout, dependencies, or PR-authored scripts in this privileged job.
      - name: Sync native change label
        uses: actions/github-script@v8
        env:
          CHANGED_PLATFORMS: ${{ needs.fingerprint.outputs.changed_platforms }}
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pull.state !== "open" || pull.head.sha !== context.payload.pull_request.head.sha) return;
            const value = process.env.CHANGED_PLATFORMS ?? "";
            if (!["", "ios", "android", "ios android"].includes(value)) {
              throw new Error("Invalid fingerprint output.");
            }
            const name = "📱 Native Change";
            try {
              await github.rest.issues.getLabel({ ...repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({ ...repo, name, color: "d93f0b", description: "Native fingerprint changed; a new native build is required for compatible OTA updates." });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await github.rest.issues.getLabel({ ...repo, name });
              }
            }
            const hasLabel = pull.labels.some((label) => label.name === name);
            if (value && !hasLabel) {
              await github.rest.issues.addLabels({ ...repo, issue_number: number, labels: [name] });
            } else if (!value && hasLabel) {
              try {
                await github.rest.issues.removeLabel({ ...repo, issue_number: number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
