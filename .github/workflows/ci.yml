name: CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maintenance:
    name: OpenT3Code Maintenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Test fork maintenance and PR automation
        run: node --test .github/scripts/opent3code-*.test.cjs

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Verify maintained-file formatting with an actionable diff
        run: |
          vp fmt README.md CONTRIBUTING.md docs/operations/opent3code.md docs/operations/pr-actions.md .github/opent3code-vouched.json .github/scripts/opent3code-*.cjs .github/workflows/ci.yml .github/workflows/deploy-relay.yml .github/workflows/opent3code-sync.yml .github/workflows/pr-size.yml .github/workflows/pr-vouch.yml .github/workflows/windows-tests.yml .github/workflows/mobile-fingerprint-check.yml .github/workflows/desktop-macos-preview.yml .github/workflows/desktop-macos-preview-publish.yml
          vp fmt apps/desktop/src/main.ts apps/mobile/src/features/review/shikiReviewHighlighter.test.ts
          git diff --exit-code
      - name: Check unused code
        run: vp run knip:check
      - name: Verify lint input provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/opent3code-lint-evidence"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/checkout-sha.txt"
          test "$(cat "$out/checkout-sha.txt")" = "$GITHUB_SHA"
          git ls-tree HEAD -- .github/scripts/opent3code-sync.cjs .github/scripts/opent3code-sync-audit.cjs > "$out/tree.txt"
          test ! -L .github
          test ! -L .github/scripts
          for name in opent3code-sync.cjs opent3code-sync-audit.cjs; do
            file=".github/scripts/$name"
            test -f "$file"
            test ! -L "$file"
            git show "HEAD:$file" > "$out/committed-$name"
            cp -- "$file" "$out/worktree-$name"
            git hash-object --no-filters "$file" > "$out/blob-$name.txt"
            cmp -- "$out/committed-$name" "$out/worktree-$name"
          done
          cat "$out/checkout-sha.txt" "$out/tree.txt"
      # Keep formatting on the same standalone path used by the diff above.
      - name: Check formatting
        run: vp fmt --check
      - name: Check lint and types
        shell: bash
        run: |
          set -o pipefail
          vp check --no-fmt 2>&1 | tee "$RUNNER_TEMP/opent3code-lint-evidence/check.log"
      - name: Typecheck
        run: vpr typecheck
      - uses: ./.github/actions/setup-apt-mirrors
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build desktop pipeline
        run: vp run build:desktop
      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - name: Upload maintained-file and lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maintained-files-format-${{ github.sha }}
          include-hidden-files: true
          path: |
            .github/opent3code-vouched.json
            .github/scripts/opent3code-*.cjs
            .github/workflows/ci.yml
            .github/workflows/pr-size.yml
            .github/workflows/pr-vouch.yml
            .github/workflows/windows-tests.yml
            .github/workflows/mobile-fingerprint-check.yml
            .github/workflows/desktop-macos-preview.yml
            .github/workflows/desktop-macos-preview-publish.yml
            docs/operations/pr-actions.md
            apps/desktop/src/main.ts
            vite.config.ts
            oxlint-plugin-t3code/
            package.json
            pnpm-workspace.yaml
            ${{ runner.temp }}/opent3code-lint-evidence/
          retention-days: 3

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - uses: ./.github/actions/setup-apt-mirrors
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py
      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs
      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done
      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }
          row='[.filename, (.previous_filename // empty)] | @tsv'
          if [[ -n "${PR_NUMBER}" ]]; then
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."
            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi
          paths=$(tr '\t' '\n' <<< "$rows")
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'
          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile
      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  pr_gate:
    name: PR Gate
    if: always()
    needs:
      - maintenance
      - check
      - test
      - test_server
      - rust
      - mobile_native_changes
      - mobile_native_static_analysis
      - release_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const required = ['maintenance', 'check', 'test', 'test_server', 'rust', 'mobile_native_changes', 'release_smoke'];
          const failed = required.filter(name => results[name]?.result !== 'success');
          const native = results.mobile_native_static_analysis?.result;
          const notNeeded = results.mobile_native_changes?.outputs.changed === 'false';
          if (!(native === 'success' || (notNeeded && native === 'skipped'))) failed.push('mobile_native_static_analysis');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## PR Gate\n\n' + Object.entries(results).map(([name, job]) => `- ${name}: ${job.result}`).join('\n') + '\n');
          if (failed.length) {
            console.error(`Required checks did not succeed: ${failed.join(', ')}`);
            process.exit(1);
          }
          NODE
