name: OpenT3Code pinned sync preparation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/opent3code-sync-candidate.yml
permissions:
  contents: read
concurrency:
  group: opent3code-pinned-sync-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository_id == '1341460159' && github.head_ref == 'chore/upstream-sync-20261015' && github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of application code. The token only creates
      # immutable Git data objects; no refs, PR states, releases or settings.
      - name: Materialize the exact two-commit candidate without updating a branch
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          FORK_SHA: a02ffa38e8401275da3acf76436d8dc99367fceb
          UPSTREAM_SHA: 263097a8da038a143f2b7b7817250f0ad390ea32
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'opent3code-batch'
          repo=root/'source.git';out=root/'evidence';out.mkdir(parents=True)
          fork=os.environ['FORK_SHA'];upstream=os.environ['UPSTREAM_SHA'];parent=os.environ['EXPECTED_HEAD']
          endpoint='https://api.github.com/repos/Hylouis233/opent3code'
          allowed={'apps/mobile/src/features/threads/threadListV2.test.ts','apps/mobile/src/features/threads/threadListV2.ts','apps/server/src/keybindings.test.ts','apps/server/src/keybindings.ts','apps/web/src/components/Sidebar.logic.test.ts','apps/web/src/components/Sidebar.logic.ts','apps/web/src/components/ThreadNotificationCoordinator.tsx','apps/web/src/composer-logic.test.ts','apps/web/src/keybindings.test.ts','docs/user/keybindings.md','packages/client-runtime/src/state/entities.test.ts','packages/client-runtime/src/state/models.ts','packages/client-runtime/src/state/threadExecution.ts','packages/shared/src/keybindings.ts'}
          def api(path,body=None):
              req=urllib.request.Request(endpoint+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          if api('/git/ref/heads/main')['object']['sha']!=fork:raise SystemExit('Main changed; reconcile first')
          if api('/git/ref/heads/chore/upstream-sync-20261015')['object']['sha']!=parent:raise SystemExit('Preparation head changed')
          subprocess.run(['git','init','--bare',str(repo)],check=True)
          def git(*args,check=True):
              return subprocess.run(['git','--git-dir='+str(repo),*args],check=check,stdout=subprocess.PIPE)
          for url,sha in [('https://github.com/Hylouis233/opent3code.git',fork),('https://github.com/pingdotgg/t3code.git',upstream)]:
              git('fetch','--filter=blob:none','--no-tags','--no-recurse-submodules','--depth=4096',url,sha)
          base=git('merge-base',fork,upstream).stdout.decode().strip()
          if base!='a5b34b25378fbbf90ce36ee101a11528ccf11c7e':raise SystemExit('Unexpected common ancestor')
          result=git('merge-tree','--write-tree','--messages',fork,upstream,check=False)
          if result.returncode:raise SystemExit('Conflict in the first batch; no candidate published')
          tree=result.stdout.splitlines()[0].decode()
          fork_tree=git('rev-parse',fork+'^{tree}').stdout.decode().strip()
          paths=[p.decode() for p in git('diff','--name-only','-z',fork,tree).stdout.split(b'\0') if p]
          if set(paths)!=allowed:raise SystemExit('Unexpected candidate path set')
          entries=[];files=[]
          for path in sorted(paths):
              raw=git('ls-tree',tree,'--',path).stdout.decode().strip().split('\t')[0]
              mode,kind,sha=raw.split()
              if mode!='100644' or kind!='blob':raise SystemExit('Unexpected source mode')
              data=git('cat-file','blob',sha).stdout
              if len(data)>1_000_000:raise SystemExit('Oversized candidate file')
              content=data.decode('utf-8')
              entries.append({'path':path,'mode':mode,'type':kind,'content':content})
              files.append({'path':path,'sha':sha,'content':content,'sha256':hashlib.sha256(data).hexdigest()})
          remote_tree=api('/git/trees',{'base_tree':fork_tree,'tree':entries})['sha']
          if remote_tree!=tree:raise SystemExit('Git tree mismatch')
          commit=api('/git/commits',{'message':'merge: integrate upstream completion notifications and background-thread shortcuts','tree':tree,'parents':[parent,fork,upstream]})['sha']
          metadata={'fork':fork,'base':base,'selected_upstream':upstream,'parent':parent,'candidate_tree':tree,'candidate_commit':commit,'changed_files':len(paths),'branch_updated':False,'merged':False,'notice':'Immutable first-batch candidate only. Application checks and review are still required. Remaining upstream updates are not included.'}
          (out/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          (out/'files.json').write_text(json.dumps(files,indent=2)+'\n')
          (out/'candidate.diff').write_bytes(git('diff',fork,tree).stdout)
          print(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: opent3code-first-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/opent3code-batch/evidence/
          if-no-files-found: error
          retention-days: 7
