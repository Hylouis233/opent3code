name: Desktop Preview Report

# Trusted API-only counterpart. Never download or execute the untrusted bundle.
# Independent signing, notarization, releases and upstream hosting are NOT enabled.
on:
  workflow_run:
    workflows: [Desktop macOS Preview]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: desktop-preview-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    name: Publish preview artifact link
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted reporter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Test reporter
        run: node --test .github/scripts/opent3code-pr-report.test.cjs
      - name: Update preview comment
        uses: actions/github-script@v8
        with:
          script: |
            const reporter = require("./.github/scripts/opent3code-pr-report.cjs");
            await reporter.publishPreview({ github, context, core });
