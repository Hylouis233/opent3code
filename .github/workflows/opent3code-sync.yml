name: OpenT3Code upstream sync

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/opent3code-sync.yml
      - .github/scripts/opent3code-sync-audit.cjs
      - .github/scripts/opent3code-sync-audit.test.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/opent3code-sync.yml
      - .github/scripts/opent3code-sync.cjs
      - .github/scripts/opent3code-sync.test.cjs
      - .github/scripts/opent3code-sync-audit.cjs
      - .github/scripts/opent3code-sync-audit.test.cjs

permissions:
  contents: read

concurrency:
  group: opent3code-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository_id == '1341460159' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      head: ${{ steps.prepare.outputs.head }}
      base: ${{ steps.prepare.outputs.base }}
      merge: ${{ steps.prepare.outputs.merge }}
      auto_merge: ${{ steps.prepare.outputs.auto_merge }}
    steps:
      - name: Load trusted policy through the API and prepare a cross-repository PR
        id: prepare
        uses: actions/github-script@v8
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (repo.id !== 1341460159 || repo.owner.login !== 'Hylouis233') {
              throw new Error('Unexpected repository.');
            }
            const { data: base } = await github.rest.repos.getBranch({
              ...context.repo, branch: repo.default_branch,
            });
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: '.github/scripts/opent3code-sync.cjs', ref: base.commit.sha,
            });
            if (file.type !== 'file' || file.encoding !== 'base64') {
              throw new Error('Trusted policy file is unavailable.');
            }
            const { Module } = require('node:module');
            const policy = new Module('opent3code-sync.cjs');
            policy._compile(Buffer.from(file.content, 'base64').toString('utf8'), 'opent3code-sync.cjs');
            await policy.exports.prepare({ github, context, core });

  validate:
    needs: prepare
    if: needs.prepare.outputs.merge != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Fetch the public candidate without Git credentials or submodule traversal
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_MERGE: ${{ needs.prepare.outputs.merge }}
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=2 origin "$EXPECTED_MERGE"
          git sparse-checkout init --no-cone
          printf '/*\n!/.repos/\n' > .git/info/sparse-checkout
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Install native desktop build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Ensure Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Validate fork maintenance
        run: node --test .github/scripts/opent3code-sync.test.cjs
      - name: Check unused code
        run: vp run knip:check
      - name: Lint and formatting
        run: vp check
      - name: Typecheck
        run: vp run typecheck
      - name: Test application workspaces
        run: vp run test
      - name: Build desktop pipeline
        run: vp run build:desktop
      - name: Verify desktop preload
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  merge:
    needs: [prepare, validate]
    if: needs.validate.result == 'success' && needs.prepare.outputs.auto_merge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Recheck using only the policy from the trusted base
        uses: actions/github-script@v8
        env:
          SYNC_PR: ${{ needs.prepare.outputs.pr }}
          SYNC_HEAD: ${{ needs.prepare.outputs.head }}
          SYNC_BASE: ${{ needs.prepare.outputs.base }}
          SYNC_MERGE: ${{ needs.prepare.outputs.merge }}
        with:
          script: |
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: '.github/scripts/opent3code-sync.cjs', ref: process.env.SYNC_BASE,
            });
            if (file.type !== 'file' || file.encoding !== 'base64') {
              throw new Error('Trusted policy file is unavailable.');
            }
            const { Module } = require('node:module');
            const policy = new Module('opent3code-sync.cjs');
            policy._compile(Buffer.from(file.content, 'base64').toString('utf8'), 'opent3code-sync.cjs');
            await policy.exports.merge({ github, context, core, expected: {
              pr: process.env.SYNC_PR,
              head: process.env.SYNC_HEAD,
              base: process.env.SYNC_BASE,
              merge: process.env.SYNC_MERGE,
              validationSucceeded: true,
            }});

  diagnose:
    name: Inspect upstream conflicts (not validation)
    needs: prepare
    if: ${{ always() && !cancelled() && github.repository_id == '1341460159' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.repository.id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Capture immutable public repository heads
        id: refs
        uses: actions/github-script@v8
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const upstream = { owner: 'pingdotgg', repo: 't3code' };
            const { data: source } = await github.rest.repos.get(upstream);
            if (repo.id !== 1341460159 || repo.owner.login !== 'Hylouis233' || repo.default_branch !== 'main' || source.id !== 1153130349 || source.default_branch !== 'main') {
              throw new Error('Unexpected fork or upstream identity.');
            }
            const { data: base } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const { data: head } = await github.rest.repos.getBranch({ ...upstream, branch: 'main' });
            for (const [name, sha] of Object.entries({ base: base.commit.sha, head: head.commit.sha, tool: context.sha })) {
              if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid snapshot SHA.');
              core.setOutput(name, sha);
            }
      - name: Load the audit tool without persisted credentials
        env:
          TOOL_SHA: ${{ steps.refs.outputs.tool }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init --bare --quiet "$RUNNER_TEMP/opent3code-audit-tool.git"
          git -C "$RUNNER_TEMP/opent3code-audit-tool.git" fetch --quiet --no-tags --no-recurse-submodules --depth=1 https://github.com/Hylouis233/opent3code.git "$TOOL_SHA"
          git -C "$RUNNER_TEMP/opent3code-audit-tool.git" show "$TOOL_SHA:.github/scripts/opent3code-sync-audit.cjs" > "$RUNNER_TEMP/opent3code-sync-audit.cjs"
      - name: Enumerate all changed paths and compute conflicts without checkout
        env:
          AUDIT_BASE: ${{ steps.refs.outputs.base }}
          AUDIT_HEAD: ${{ steps.refs.outputs.head }}
          AUDIT_TOOL_SHA: ${{ steps.refs.outputs.tool }}
          AUDIT_ROOT: ${{ runner.temp }}/opent3code-sync-audit
        run: node "$RUNNER_TEMP/opent3code-sync-audit.cjs"
      - name: Upload complete diagnostic evidence (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: opent3code-sync-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/opent3code-sync-audit/report/
          if-no-files-found: error
          retention-days: 14
