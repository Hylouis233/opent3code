name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-vouch.yml
      - .github/scripts/opent3code-pr.cjs
      - .github/opent3code-vouched.json

permissions:
  contents: read

concurrency:
  group: trust-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Public repository: no token, no submodule traversal, and no PR checkout.
      - name: Checkout trusted labeler
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --filter=blob:none --no-tags --no-recurse-submodules --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          git sparse-checkout set --no-cone '/.github/scripts/'
          git checkout --detach FETCH_HEAD
      - name: Test label policy
        run: node --test .github/scripts/opent3code-pr.test.cjs
      - name: Initialize labels and classify pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const labeler = require("./.github/scripts/opent3code-pr.cjs");
            await labeler.labelPullRequests({ github, context, core, kind: "trust" });
