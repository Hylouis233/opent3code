name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-vouch.yml
      - .github/scripts/opent3code-pr.cjs
      - .github/opent3code-vouched.json

permissions:
  contents: read

concurrency:
  group: trust-labels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Privileged workflow: execute default-branch code only, never PR code.
      - name: Checkout trusted labeler
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Test label policy
        run: node --test .github/scripts/opent3code-pr.test.cjs
      - name: Initialize labels and classify pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const labeler = require("./.github/scripts/opent3code-pr.cjs");
            await labeler.labelPullRequests({ github, context, core, kind: "trust" });
