name: Approve selected PR 1 checks once

on:
  push:
    branches: [ops/approve-pr1-checks-20260915]
    paths: [.github/workflows/approve-pr1-checks-once.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: approve-pr1-50ff4c3-once
  cancel-in-progress: false

jobs:
  approve:
    if: github.repository_id == '1341460159' && github.actor == 'Hylouis233'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify identities and call the official per-run approval endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = 'Hylouis233/opent3code'
          head = '50ff4c371eab927a9650c114975241999f4cd7b1'
          base = '204ef4bdf7d080fd9e76322135800e5283baa112'
          merge = '10a4544dbaf04af51fd7702c3c75a8c1f94ad613'
          targets = [
              (34943486408, 'CI', '.github/workflows/ci.yml', 358431879),
              (34943486385, 'Mobile Fingerprint Check', '.github/workflows/mobile-fingerprint-check.yml', 358431888),
          ]
          results = []
          opener = urllib.request.build_opener()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())

          def api(path, method='GET'):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                      'User-Agent': 'OpenT3Code-explicit-approval',
                  },
              )
              with opener.open(request, timeout=30) as response:
                  data = response.read()
                  return response.status, json.loads(data) if data else None

          def verify_current_candidate():
              _, pull = api('pulls/1')
              assert pull['state'] == 'open' and not pull['merged'], 'PR is no longer open'
              assert pull['head']['sha'] == head, 'Upstream head moved; fresh approval required'
              assert pull['head']['repo']['id'] == 1153130349, 'Unexpected source repository'
              assert pull['base']['repo']['id'] == 1341460159, 'Unexpected destination repository'
              assert pull['merge_commit_sha'] == merge, 'Merge candidate changed'
              _, main = api('git/ref/heads/main')
              assert main['object']['sha'] == base, 'Fork main moved; fresh approval required'
              _, candidate = api('git/commits/' + merge)
              assert [p['sha'] for p in candidate['parents']] == [base, head], 'Unexpected merge ancestry'

          def verify_run(target):
              run_id, name, path, workflow_id = target
              _, run = api('actions/runs/' + str(run_id))
              assert run['id'] == run_id and run['name'] == name, 'Unexpected run identity'
              assert run['event'] == 'pull_request' and run['head_sha'] == head, 'Unexpected event or source'
              assert run['repository']['id'] == 1341460159, 'Unexpected run repository'
              assert run['head_repository']['id'] == 1153130349, 'Unexpected run source repository'
              assert run['path'] == path and run['workflow_id'] == workflow_id, 'Unexpected workflow'
              return run

          try:
              assert os.environ['GITHUB_REPOSITORY'] == repo
              verify_current_candidate()
              for target in targets:
                  verify_run(target)
              for target in targets:
                  verify_current_candidate()
                  run = verify_run(target)
                  if run['conclusion'] != 'action_required':
                      results.append({'run_id': target[0], 'name': target[1], 'action': 'no approval needed', 'status': run['status'], 'conclusion': run['conclusion']})
                      continue
                  code, _ = api('actions/runs/' + str(target[0]) + '/approve', 'POST')
                  assert code == 201, 'Unexpected approval response'
                  results.append({'run_id': target[0], 'name': target[1], 'action': 'approval accepted', 'http_status': code})
          except urllib.error.HTTPError as error:
              results.append({'action': 'stopped on API rejection', 'http_status': error.code})
              raise SystemExit('GitHub API rejected the request (HTTP ' + str(error.code) + '); no permission changes or alternative credentials attempted.')
          finally:
              text = json.dumps(results, indent=2) + '\n'
              print(text)
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
                  output.write('## Explicit PR 1 validation approvals\n\n```json\n' + text + '```\n\nNo preview, deployment, merge, or repository-policy operation is performed.\n')
          PY
