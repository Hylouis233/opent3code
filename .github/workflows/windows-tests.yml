# Like upstream, Windows remains an on-demand diagnostic lane, not a required gate.
name: Windows Tests

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace directory, e.g. apps/server or packages/shared. Empty runs non-server packages."
        type: string
        default: ""
      files:
        description: "Space-separated test files relative to the workspace. Requires package."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ inputs.package || 'all non-server' }})
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'
      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-tests-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: vp install
      - name: Ensure Electron runtime is installed
        if: inputs.package == '' || inputs.package == 'apps/desktop'
        run: vp run --filter "@t3tools/desktop" ensure:electron
      - name: Test
        shell: pwsh
        env:
          TEST_PACKAGE: ${{ inputs.package }}
          TEST_FILES: ${{ inputs.files }}
        run: |
          $package = $env:TEST_PACKAGE.Trim()
          $files = $env:TEST_FILES.Trim()
          if ($package -ne '' -and $package -notmatch '^(apps|packages)/[A-Za-z0-9_-]+$') {
            throw 'package must name an apps/ or packages/ workspace'
          }
          if ($files -ne '' -and $package -eq '') { throw 'files requires package' }
          if ($package -eq '') {
            vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test
          } elseif ($files -eq '') {
            vp run --filter "./$package" test
          } else {
            $testFiles = $files -split '\s+'
            if ($testFiles | Where-Object { $_ -notmatch '^[A-Za-z0-9_./-]+$' -or $_.StartsWith('-') -or $_.StartsWith('/') -or $_ -match '(^|/)\.\.(/|$)' }) {
              throw 'files must contain relative test paths, not flags or parent paths'
            }
            Set-Location $package
            vp test run @testFiles
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
